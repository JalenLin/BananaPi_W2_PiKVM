%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/realtek,rtd1295-irq-mux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1295/RTD1296 peripheral interrupt mux

description: >
  The SoC folds a block of peripheral interrupts onto a single GIC SPI. There
  are two such muxes, one in the MISC register block and one in the ISO block,
  each with a status register showing the pending sources and an enable
  register gating them.

  A source is identified by its bit in the status register, which is what goes
  in a child's "interrupts" property. The matching bit in the enable register
  is often a different number, so the mapping lives in the driver rather than
  in the device tree.

maintainers:
  - Jalen Lin <jalen.lin@gmail.com>

properties:
  compatible:
    enum:
      - realtek,rtd1295-misc-irq-mux
      - realtek,rtd1295-iso-irq-mux

  reg:
    items:
      - description: interrupt status register
      - description: interrupt enable register

  interrupts:
    maxItems: 1
    description: the GIC SPI this mux is folded onto

  interrupt-controller: true

  "#interrupt-cells":
    const: 1
    description: the source's bit number in the status register

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    interrupt-controller@0 {
      compatible = "realtek,rtd1295-iso-irq-mux";
      reg = <0x0 0x4>, <0x40 0x4>;
      interrupts = <GIC_SPI 41 IRQ_TYPE_LEVEL_HIGH>;
      interrupt-controller;
      #interrupt-cells = <1>;
    };

# Let PID 1 feed the SoC watchdog, so a hung system resets itself instead of
# waiting for someone to pull the power. Kernels are installed over the
# network (scripts/push-kernel-mainline.sh), and nobody may be near the board.
#
# RebootWatchdogSec bounds a shutdown that hangs half way; the kernel's own
# restart handler is what normally resets the board.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min

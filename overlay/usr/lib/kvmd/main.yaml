# BPI-W2 PiKVM platform configuration
#
# The equivalent of PiKVM upstream's configs/kvmd/main/<platform>-<board>.yaml.
# Do not edit this file directly; put local changes in /etc/kvmd/override.yaml.

kvmd:
    hid:
        # Patch 0006 pins the RTD1296's Type-C port to peripheral mode, the
        # kernel has CONFIG_USB_CONFIGFS_F_HID, and kvmd-otg creates the
        # gadget.
        type: otg

        mouse_alt:
            # Disable the second (relative-positioning) mouse. dwc3 only has
            # 2 usable IN endpoints, and keyboard + mouse already use them
            # both -- see the otg section at the end of this file. An empty
            # string stops kvmd from even creating hid.usb2.
            device: ""

    atx:
        # The 40-pin ATX control lines are not wired yet.
        type: disabled

    msd:
        # Virtual media (mass storage) is also a USB gadget and the kernel
        # does have CONFIG_USB_F_MASS_STORAGE=y, but it **cannot coexist with
        # the mouse**: dwc3 has only 2 usable IN endpoints and keyboard +
        # mouse consume both (see the otg section at the end of this file).
        #
        # If virtual media matters more to you than the mouse, put this in
        # /etc/kvmd/override.yaml:
        #
        #   kvmd:
        #       msd:
        #           type: otg
        #       hid:
        #           mouse:
        #               device: ""
        #   otg:
        #       devices:
        #           hid:
        #               mouse:
        #                   start: false
        #
        # then run: systemctl restart kvmd-otg kvmd
        type: disabled

    streamer:
        cmd:
            - "/usr/bin/ustreamer"
            - "--device=/dev/kvmd-video"
            - "--persistent"
            # rtk_hdmirx only emits NV16 / NV12 / BGR32, none of which
            # ustreamer supports natively as a packed format. NV16 is the
            # smallest of them that does not lose vertical chroma resolution
            # (it needs our semi-planar patch to ustreamer).
            - "--format=NV16"
            # This driver does not implement VIDIOC_QUERY_DV_TIMINGS, so
            # --dv-timings is unavailable and the resolution has to be
            # hardcoded -- and it must match what the source actually sends.
            # The EDID we serve (Realtek,edid-table in the DTS) prefers
            # 1080p60, so normal negotiation lands here. If your source
            # always outputs something else, change this line; check the
            # current value with hdmirx-info.
            - "--resolution=1920x1080"
            # Encoding is on the CPU: none of the SoC's codec engines exposes
            # a V4L2 M2M interface (the BSP provides vendor ioctls instead).
            # 3 is the measured optimum -- a 4th worker fights the capture and
            # HTTP threads and costs about 10%. See section 10 of
            # docs/06-changes.md for the survey of the hardware encoders.
            - "--workers=3"
            - "--quality={quality}"
            - "--desired-fps={desired_fps}"
            # Kept at upstream's 30 for the Pi.
            #
            # This was briefly suspected of causing the long wait before the
            # Web UI showed a picture. It was not: the real cause was the
            # semi-planar encoder reading the uncached mmap byte by byte,
            # which took 830 ms per frame and left the stream at 3 fps, so
            # dropping 30 identical frames meant seconds of silence. With the
            # encoder fixed, capture runs at 30 fps and 30 dropped frames is
            # at most one second.
            - "--drop-same-frames=30"
            - "--unix={unix}"
            - "--unix-rm"
            - "--unix-mode=0660"
            - "--exit-on-parent-death"
            - "--process-name-prefix={process_name_prefix}"
            - "--notify-parent"
            - "--no-log-colors"


otg:
    # The RTD1296's dwc3 has very few usable endpoints.
    # GHWPARAMS3 = 0x030c6485 → 6 endpoints in total, 3 of them IN. After the
    # control endpoint ep0 that leaves 2 IN + 2 OUT (debugfs likewise shows
    # only ep1in/ep1out/ep2in/ep2out).
    #
    # Kernel 4.9's f_hid has no no_out_endpoint configfs attribute (kvmd tries
    # to write it and skips on failure), so each HID function always takes
    # 1 IN + 1 OUT and at most two functions fit.
    #
    # Without this setting kvmd adds all three of keyboard + mouse +
    # mouse_alt to the config, the third hidg_bind fails, and the entire
    # gadget then fails to bind to the UDC:
    #   configfs-gadget gadget: hidg_bind FAILED
    #   configfs-gadget 98020000.dwc3_drd: failed to start kvmd: -19
    #
    # With it set to 2, kvmd skips what will not fit and logs
    #   Function 'hid.usb2' not be started: No available endpoints
    # after which keyboard + mouse bind normally.
    endpoints: 2

# BPI-W2 PiKVM platform configuration
#
# The equivalent of PiKVM upstream's configs/kvmd/main/<platform>-<board>.yaml.
# Do not edit this file directly; put local changes in /etc/kvmd/override.yaml.

kvmd:
    hid:
        # The Type-C port is a USB device (the BSP kernel: patch 0006; the
        # mainline kernel: dr_mode = "peripheral" in the board DTS), the
        # kernel has the configfs HID function, and kvmd-otg builds the
        # gadget.
        type: otg

        # USB endpoints decide what fits on this board: the RTD1296's dwc3
        # has two IN endpoints besides ep0 (see the otg section at the end).
        #
        # combined: true (the default here) makes the keyboard and the mouse
        # ONE HID function, told apart by Report ID (patches/kvmd/0002). That
        # uses one IN endpoint and leaves the other for virtual media, so
        # keyboard, mouse and MSD all work at once.
        #
        # The cost: a HID device with Report IDs cannot be a boot-protocol
        # keyboard, and much BIOS/UEFI setup firmware only understands boot
        # protocol. Typing in the target's firmware menus may not work in
        # this mode; in the running OS it does. If you need the firmware,
        # put this in /etc/kvmd/override.yaml:
        #
        #   kvmd:
        #       hid:
        #           combined: false
        #       msd:
        #           type: disabled
        #   otg:
        #       endpoints: 2
        #
        # then run: systemctl stop kvmd; systemctl restart kvmd-otg; systemctl start kvmd
        # That gives a separate boot keyboard and mouse, and no MSD.
        combined: true

        mouse_alt:
            # No second (relative-positioning) mouse: it would need a third IN
            # endpoint. An empty string stops kvmd from creating it.
            device: ""

    atx:
        # The 40-pin ATX control lines are not wired yet.
        type: disabled

    msd:
        # Virtual media. Its storage is /var/lib/kvmd/msd, a read-only bind
        # mount of /var/lib/kvmd/msd.data on the rootfs (see /etc/fstab);
        # kvmd remounts it read-write only while writing an image.
        type: otg

    streamer:
        # H.264 for WebRTC (kvmd-janus) and the direct H.264 mode
        # (kvmd-media), in kbit/s.
        h264_bitrate:
            default: 5000
        cmd:
            - "/usr/bin/ustreamer"
            - "--device=/dev/kvmd-video"
            - "--persistent"
            # rtk_hdmirx emits NV16 / NV12 / BGR32, none of which ustreamer
            # supports natively (our semi-planar patch to ustreamer adds
            # them). NV12 because the H.264 encoder only takes 4:2:0; the
            # JPEG path loses vertical chroma resolution with it, which is
            # not visible on a desktop.
            - "--format=NV12"
            # Follow the source's resolution. The mainline driver
            # (kernel-6.18 branch) implements VIDIOC_QUERY_DV_TIMINGS and
            # returns ENOLINK without a signal, which ustreamer shows as "no
            # signal" and retries. The BSP 4.9 driver has no DV timings;
            # ustreamer then falls back to --resolution below, which has to
            # match what the source sends -- the EDID we serve prefers
            # 1080p60 (check with hdmirx-info).
            - "--dv-timings"
            - "--resolution=1920x1080"
            # JPEG is encoded on the CPU: the SoC's JPEG engine has no V4L2
            # driver. 3 is the measured optimum -- a 4th worker fights the
            # capture and HTTP threads and costs about 10%. See section 10 of
            # docs/06-changes.md for the survey of the hardware encoders.
            - "--workers=3"
            - "--quality={quality}"
            - "--desired-fps={desired_fps}"
            # Kept at upstream's 30 for the Pi.
            #
            # This was briefly suspected of causing the long wait before the
            # Web UI showed a picture. It was not: the real cause was the
            # semi-planar encoder reading the uncached mmap byte by byte,
            # which took 830 ms per frame and left the stream at 3 fps, so
            # dropping 30 identical frames meant seconds of silence. With the
            # encoder fixed, capture runs at 30 fps and 30 dropped frames is
            # at most one second.
            - "--drop-same-frames=30"
            - "--unix={unix}"
            - "--unix-rm"
            - "--unix-mode=0660"
            - "--exit-on-parent-death"
            - "--process-name-prefix={process_name_prefix}"
            - "--notify-parent"
            - "--no-log-colors"
            # As PiKVM's own configs since kvmd 4.216: the CPUs at full speed
            # while someone watches, schedutil otherwise. kvmd-pm.service
            # lets the kvmd group write the governor.
            - "--cpu-scaling-governor-idle=schedutil"
            - "--cpu-scaling-governor-active=performance"
            # H.264 from VE1, the CODA980, through the mainline coda driver
            # (docs/09-mainline-bringup.md, section 11). Captured frames go to
            # it as DMA-BUFs. The BSP 4.9 kernel has no such device; its
            # image removes these again (/etc/kvmd/override.d/).
            - "--h264-sink=kvmd::ustreamer::h264"
            - "--h264-sink-mode=0660"
            - "--h264-bitrate={h264_bitrate}"
            - "--h264-gop={h264_gop}"
            - "--h264-m2m-device=/dev/kvmd-h264"


otg:
    # The RTD1296's dwc3 has very few usable endpoints.
    # GHWPARAMS3 = 0x030c6485 -> 6 endpoints in total, 3 of them IN. After the
    # control endpoint ep0 that leaves 2 IN + 2 OUT (debugfs likewise shows
    # only ep1in/ep1out/ep2in/ep2out).
    #
    # kvmd counts endpoints per function: HID 1, MSD 2. With the combined HID
    # that is 1 + 2 = 3, which the hardware holds -- the HID function sets
    # no_out_endpoint (the mainline kernel supports it), so it takes one IN,
    # and MSD takes the other IN plus an OUT.
    #
    # With separate keyboard and mouse (combined: false) set this to 2: two
    # HID functions already use both IN endpoints. The BSP 4.9 kernel's f_hid
    # has no no_out_endpoint, so each HID function there also takes an OUT;
    # 2 is right for that kernel too.
    endpoints: 3


# Readers of the H.264 sink: kvmd-media (direct H.264 over a websocket) and
# Janus's ustreamer plugin (WebRTC), as on PiKVM V4.
media:
    memsink:
        h264:
            sink: "kvmd::ustreamer::h264"
